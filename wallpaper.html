<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aurora Live Wallpaper</title>
<link rel="stylesheet" href="wallpaper-core.css">
</head>
<body>
  <canvas id="aurora"></canvas>
  <canvas id="network"></canvas>
  <div class="vignette"></div>
  <div class="clock">
    <div class="time"><span id="hm">--:--</span><span class="sec" id="ss">00</span></div>
    <div class="date" id="date">—</div>
    <div class="greet" id="greet"></div>
  </div>

  <script src="wallpaper-core.js"></script>

  <!-- Module runtime: injects any enabled modules (e.g. the calendar overlay).
       Manage with: HtmlWallpaper.exe module <list|enable|disable> <id> -->
  <script src="module-loader.js"></script>
</body>
</html>
