<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aurora + Calendar Live Wallpaper</title>
<!-- Shared base animation (aurora + particle network + clock). -->
<link rel="stylesheet" href="../wallpaper-core.css">
</head>
<body>
  <canvas id="aurora"></canvas>
  <canvas id="network"></canvas>
  <div class="vignette"></div>
  <div class="clock">
    <div class="time"><span id="hm">--:--</span><span class="sec" id="ss">00</span></div>
    <div class="date" id="date">—</div>
    <div class="greet" id="greet"></div>
  </div>

  <script src="../wallpaper-core.js"></script>

  <!-- Outlook "Today" calendar overlay module. Remove this one line to turn it off. -->
  <script src="calendar-overlay.js"></script>
</body>
</html>
